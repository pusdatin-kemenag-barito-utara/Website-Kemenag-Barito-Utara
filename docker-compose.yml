services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kemenag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health || exit 1"]
      interval: 25s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kemenag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_URL=http://backend:8080
      - BACKEND_INTERNAL_URL=http://backend:8080
      - TZ=Asia/Jakarta
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 25s
      timeout: 5s
      retries: 3
      start_period: 30s

