services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kemenag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      - PORT=8080
      - TZ=Asia/Jakarta

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kemenag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_URL=http://backend:8080
      - BACKEND_INTERNAL_URL=http://backend:8080
      - TZ=Asia/Jakarta
    depends_on:
      - backend
